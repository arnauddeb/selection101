<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Jukebox · Les disques</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e5392b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Page visiteurs (QR code) : consultation seule, aucun prix, aucun lien vers le reste du site. */
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7; --carte: #fff; --ink: #111113; --muted: #6e6e73; --faible: #a1a1a6;
      --ligne: rgba(0, 0, 0, .08); --champ: rgba(118, 118, 128, .12); --accent: #e5392b;
      --verre: rgba(245, 245, 247, .82);
      --ombre: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
      --r: 16px;
      --g: max(16px, env(safe-area-inset-left, 0px)); --d: max(16px, env(safe-area-inset-right, 0px));
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0b; --carte: #161618; --ink: #f5f5f7; --muted: #98989d; --faible: #636366;
        --ligne: rgba(255, 255, 255, .09); --champ: rgba(118, 118, 128, .24); --accent: #ff5240;
        --verre: rgba(10, 10, 11, .78);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.4 Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .barre {
      position: sticky; top: 0; z-index: 10;
      padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--d) 12px var(--g);
      background: var(--verre); border-bottom: 1px solid var(--ligne);
      -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    }
    .interieur { max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
    .aide { margin: 2px 0 14px; color: var(--muted); font-size: 14px; }
    .aide b { color: var(--accent); font-weight: 600; }
    .champ {
      display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
      border-radius: 12px; background: var(--champ);
    }
    .champ svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
    .champ input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink);
      font: inherit; font-size: 17px;
    }
    .champ input::placeholder { color: var(--muted); }
    .champ input::-webkit-search-cancel-button { display: none; }
    #effacer { border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; padding: 4px; cursor: pointer; }
    .onglets {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 10px; padding: 3px;
      border-radius: 12px; background: var(--champ);
    }
    .onglets button {
      height: 36px; border: 0; border-radius: 9px; background: none; color: var(--ink);
      font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .onglets button span { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .onglets button[aria-selected="true"] { background: var(--carte); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    main { padding: 16px var(--d) calc(env(safe-area-inset-bottom, 0px) + 32px) var(--g); }
    .compte { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 20px 14px; }
    .disque { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
    .pochette {
      position: relative; aspect-ratio: 1; border-radius: var(--r); overflow: hidden;
      background: var(--carte); box-shadow: var(--ombre);
    }
    .pochette img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sans {
      position: absolute; inset: 0;
      background: radial-gradient(circle, var(--accent) 0 15%, #1a1a1c 15.5% 16.5%, #0d0d0f 17% 100%);
    }
    .num {
      position: absolute; top: 8px; left: 8px; min-width: 36px; height: 28px; padding: 0 9px;
      display: grid; place-items: center; border-radius: 14px;
      color: #fff; background: rgba(20, 20, 22, .6); font-size: 15px; font-weight: 700;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .num.reserve { font-size: 13px; font-weight: 600; }
    .infos { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .artiste { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .face { display: flex; gap: 7px; font-size: 14px; min-width: 0; }
    .face b { flex: none; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
    .face span { overflow: hidden; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .details { color: var(--faible); font-size: 12.5px; }
    .vide { margin: 48px 0; text-align: center; color: var(--muted); }
    @media (min-width: 700px) {
      .grille { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 26px 18px; }
    }
  </style>
</head>
<body>
  <header class="barre">
    <div class="interieur">
      <h1>Jukebox</h1>
      <p class="aide">Composez le numéro <b>rouge</b> sur le jukebox pour écouter la face choisie.</p>
      <label class="champ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="recherche" type="search" placeholder="Artiste, titre, numéro, année…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Rechercher un disque">
        <button type="button" id="effacer" hidden>Effacer</button>
      </label>
      <div class="onglets" role="tablist" aria-label="Emplacement">
        <button type="button" role="tab" id="tab-jukebox" aria-selected="true" data-vue="jukebox">Jukebox<span id="n-jukebox"></span></button>
        <button type="button" role="tab" id="tab-reserve" aria-selected="false" data-vue="reserve">Réserve<span id="n-reserve"></span></button>
      </div>
    </div>
  </header>
  <main class="interieur">
    <p class="compte" id="compte" aria-live="polite"></p>
    <div class="grille" id="grille"></div>
    <p class="vide" id="vide" hidden></p>
  </main>
  <script>
    "use strict";
    // Mémorise que cet appareil est venu par le QR code : le site principal le renverra ici (sauf tes appareils).
    try { if (!localStorage.getItem("jukebox-proprietaire")) localStorage.setItem("jukebox-visiteur", "1"); } catch (e) {}
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
    const comparer = (x, y) => String(x || "").localeCompare(String(y || ""), "fr", { sensitivity: "base" });
    // Numéros à composer : 1 + position pour la face A, 2 + position pour la face B (comme le site principal).
    const selA = (pos) => "1" + pos, selB = (pos) => "2" + pos;

    let disques = [], vue = "jukebox", q = "";

    function carte(d) {
      const img = d.pochette
        ? `<img src="${esc(d.pochette)}" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sans'}))">`
        : `<div class="sans"></div>`;
      const num = d.pos ? `<span class="num">${esc(d.pos)}</span>` : `<span class="num reserve">Réserve</span>`;
      const face = (nom, titre) => `<span class="face">${d.pos ? `<b>${nom}</b>` : ""}<span>${esc(titre)}</span></span>`;
      const details = [d.annee, d.genre].filter(Boolean).join(" · ");
      return `<article class="disque">
        <div class="pochette">${img}${num}</div>
        <div class="infos">
          <span class="artiste">${esc(d.artiste)}</span>
          ${face(d.pos ? selA(d.pos) : "", d.a)}
          ${d.b ? face(d.pos ? selB(d.pos) : "", d.b) : ""}
          ${details ? `<span class="details">${esc(details)}</span>` : ""}
        </div>
      </article>`;
    }

    // Recherche : tous les mots doivent être trouvés ; ordre emplacement, artiste, chanson, puis le reste.
    function rechercher(liste) {
      const mots = norm(q).split(" ").filter(Boolean);
      if (!mots.length) return liste;
      const numero = (d, m) => !!d.pos && (d.pos === m.padStart(2, "0") || selA(d.pos) === m || selB(d.pos) === m);
      const rang = (d) => {
        const artiste = " " + norm(d.artiste), titres = " " + norm(d.a + " " + (d.b || ""));
        const autres = norm([d.annee, d.genre].join(" "));
        let score = 0;
        for (const m of mots) {
          if (/^\d{1,3}$/.test(m) && numero(d, m)) continue;
          if (artiste.includes(" " + m)) score += 1;
          else if (artiste.includes(m)) score += 1.5;
          else if (titres.includes(" " + m)) score += 2;
          else if (titres.includes(m)) score += 2.5;
          else if (autres.includes(m)) score += 3;
          else return -1;
        }
        return score;
      };
      return liste.map((d) => [rang(d), d]).filter(([r]) => r >= 0).sort((x, y) => x[0] - y[0]).map(([, d]) => d);
    }

    function rendre() {
      const jukebox = disques.filter((d) => d.pos).sort((x, y) => x.pos.localeCompare(y.pos));
      const reserve = disques.filter((d) => !d.pos).sort((x, y) => comparer(x.artiste, y.artiste) || comparer(x.a, y.a));
      // Pendant une recherche, les onglets montrent combien de résultats chacun contient.
      const resJ = rechercher(jukebox), resR = rechercher(reserve);
      $("n-jukebox").textContent = resJ.length;
      $("n-reserve").textContent = resR.length;
      for (const b of document.querySelectorAll("[data-vue]")) b.setAttribute("aria-selected", String(b.dataset.vue === vue));
      const liste = vue === "jukebox" ? resJ : resR;
      $("grille").innerHTML = liste.map(carte).join("");
      $("compte").textContent = q ? `${liste.length} disque${liste.length > 1 ? "s" : ""}` : "";
      $("vide").hidden = liste.length > 0;
      $("vide").textContent = q
        ? (vue === "jukebox" && resR.length ? "Rien dans le jukebox. Regardez dans la réserve." : vue === "reserve" && resJ.length ? "Rien en réserve. Regardez dans le jukebox." : "Aucun disque ne correspond.")
        : "Aucun disque.";
      $("effacer").hidden = !q;
    }

    $("recherche").addEventListener("input", (e) => { q = e.target.value; rendre(); });
    $("effacer").addEventListener("click", () => { q = ""; $("recherche").value = ""; rendre(); $("recherche").focus(); });
    for (const b of document.querySelectorAll("[data-vue]")) {
      b.addEventListener("click", () => { vue = b.dataset.vue; rendre(); scrollTo({ top: 0 }); });
    }

    fetch("disques.json", { cache: "no-cache" })
      .then((r) => r.json())
      .then((data) => { disques = data.disques || []; rendre(); })
      .catch(() => { $("vide").hidden = false; $("vide").textContent = "Impossible de charger la liste. Réessayez dans un instant."; });
  </script>
</body>
</html>
