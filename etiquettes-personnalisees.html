<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Test étiquettes personnalisées</title>
    <style>
      :root {
        --fond: #f3eadb;
        --panneau: rgba(255, 250, 241, 0.9);
        --texte: #1d1915;
        --texte-doux: #6b6156;
        --bordure: rgba(44, 35, 28, 0.14);
        --accent: #15524d;
        --accent-chaud: #b73948;
        --ombre: 0 18px 42px rgba(37, 27, 20, 0.13);
        --largeur-etiquette-mm: 77mm;
        --hauteur-etiquette-mm: 26mm;
        --largeur-etiquette: 77;
        --hauteur-etiquette: 26;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(179, 57, 72, 0.08), transparent 34%),
          linear-gradient(315deg, rgba(21, 82, 77, 0.12), transparent 38%),
          var(--fond);
        color: var(--texte);
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      }

      a {
        color: inherit;
      }

      [hidden] {
        display: none !important;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .page {
        display: grid;
        gap: 18px;
        max-width: 1220px;
        margin: 0 auto;
        padding: 22px;
      }

      .entete {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      .entete__retour,
      .bouton {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: rgba(255, 250, 241, 0.88);
        color: var(--accent);
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(37, 27, 20, 0.08);
      }

      .bouton-principal {
        color: #fff;
        background: linear-gradient(135deg, var(--accent), #1c7770);
      }

      h1 {
        margin: 8px 0 0;
        font-family: Baskerville, "Palatino Linotype", "Book Antiqua", serif;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 0.95;
        letter-spacing: 0.02em;
      }

      .surtitre {
        margin: 0;
        color: var(--accent-chaud);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .atelier {
        display: grid;
        grid-template-columns: minmax(280px, 390px) minmax(360px, 1fr);
        gap: 18px;
        align-items: start;
      }

      .panneau {
        border: 1px solid rgba(255, 255, 255, 0.62);
        border-radius: 18px;
        background: var(--panneau);
        box-shadow: var(--ombre);
      }

      .controles {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      .groupe {
        display: grid;
        gap: 10px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--bordure);
      }

      .groupe:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .groupe summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        list-style: none;
      }

      .groupe summary::-webkit-details-marker {
        display: none;
      }

      .groupe summary::after {
        content: "+";
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: rgba(21, 82, 77, 0.1);
        color: var(--accent);
        font-weight: 900;
      }

      .groupe[open] summary::after {
        content: "−";
      }

      .groupe__titre {
        margin: 0;
        color: var(--accent);
        font-weight: 800;
        font-size: 0.88rem;
      }

      .grille {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .bloc-typographie {
        display: grid;
        gap: 10px;
        align-content: start;
        padding: 10px;
        border: 1px solid var(--bordure);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.38);
      }

      .bloc-typographie h3 {
        margin: 0;
        color: var(--accent);
        font-size: 0.82rem;
        line-height: 1;
      }

      .champ {
        display: grid;
        gap: 6px;
        min-width: 0;
        color: var(--texte-doux);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .champ-large {
        grid-column: 1 / -1;
      }

      .choix-impression {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .choix-impression label,
      .option-texte {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--bordure);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.58);
        padding: 8px 10px;
        color: var(--texte);
        font-size: 0.82rem;
        font-weight: 800;
      }

      .choix-impression input,
      .option-texte input {
        width: auto;
        min-height: auto;
        padding: 0;
      }

      .etat-impression {
        margin: 0;
        color: var(--texte-doux);
        font-size: 0.78rem;
        line-height: 1.35;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--bordure);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--texte);
        padding: 9px 10px;
      }

      input[type="color"] {
        min-height: 40px;
        padding: 4px;
      }

      input[type="range"] {
        padding: 0;
        accent-color: var(--accent);
      }

      textarea {
        min-height: 112px;
        resize: vertical;
        line-height: 1.4;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .apercu {
        display: grid;
        gap: 16px;
        padding: 18px;
        overflow: hidden;
      }

      .bandeau-surprise {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--bordure);
        border-radius: 12px;
        background: rgba(255, 250, 241, 0.78);
        padding: 10px 12px;
      }

      .bandeau-surprise p {
        margin: 0;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 800;
      }

      .actions-rapides {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .scene {
        min-height: 360px;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 14px;
        border-radius: 14px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.58) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.58) 1px, transparent 1px),
          rgba(38, 33, 27, 0.06);
        background-size: 18px 18px;
        padding: 28px;
      }

      .etiquette {
        --couleur-1: #7c007c;
        --couleur-2: #d8b7ed;
        --couleur-3: #fff8ff;
        --couleur-ruban: #fff8ff;
        --couleur-vignette: #000000;
        --vignette-rgba: rgba(0, 0, 0, 0);
        --vignette-rgba-soft: rgba(0, 0, 0, 0);
        --vignette-lumiere: rgba(255, 255, 255, 0);
        --couleur-texte: #17120e;
        --couleur-artiste: #17120e;
        --angle: 25deg;
        --intensite: 0.76;
        --arrondi: 0mm;
        --trait: 4px;
        --motif-opacite: 0.22;
        --vignette: 0;
        --hauteur-haut: 37%;
        --hauteur-ruban: 34%;
        --hauteur-bande: 22%;
        --largeur-ruban: 81%;
        --decalage-ruban: 0%;
        --cran-ruban: 7%;
        --epaisseur-ligne: 3px;
        --opacite-marques: 1;
        --couleur-marques: #fff8ff;
        --largeur-marques: 14%;
        position: relative;
        width: min(100%, 770px);
        aspect-ratio: var(--largeur-etiquette) / var(--hauteur-etiquette);
        overflow: hidden;
        border-radius: var(--arrondi);
        background:
          linear-gradient(var(--angle), var(--vignette-lumiere), transparent 42%, var(--vignette-rgba-soft)),
          linear-gradient(to bottom, var(--couleur-2) 0 var(--hauteur-haut), var(--couleur-1) var(--hauteur-haut) calc(var(--hauteur-haut) + var(--trait)), var(--couleur-3) calc(var(--hauteur-haut) + var(--trait)) 100%);
        box-shadow: 0 18px 34px rgba(31, 21, 14, 0.22);
        color: var(--couleur-texte);
        font-family: "Courier Prime", "American Typewriter", "Courier New", monospace;
        text-transform: uppercase;
        --police-titres: "Courier Prime", "American Typewriter", "Courier New", monospace;
        --police-artiste: "Courier Prime", "American Typewriter", "Courier New", monospace;
      }

      .etiquette[data-police="compacte"] {
        font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      }

      .etiquette[data-police="classique"] {
        font-family: Georgia, "Times New Roman", serif;
      }

      .etiquette::before,
      .etiquette::after,
      .etiquette__decor,
      .etiquette__ruban,
      .etiquette__fleche {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .etiquette::before {
        content: "";
        background:
          linear-gradient(90deg, rgba(255, 255, 255, var(--motif-opacite)) 0 1px, transparent 1px 18px),
          linear-gradient(rgba(0, 0, 0, calc(var(--motif-opacite) * 0.34)) 0 1px, transparent 1px 14px);
        mix-blend-mode: soft-light;
      }

      .etiquette::after {
        content: "";
        background:
          linear-gradient(90deg, var(--vignette-rgba), transparent 16%, transparent 84%, var(--vignette-rgba)),
          linear-gradient(var(--vignette-lumiere), transparent 26%, transparent 72%, var(--vignette-rgba-soft));
      }

      .etiquette__decor {
        z-index: 1;
        border: var(--trait) solid var(--couleur-1);
        background: linear-gradient(to bottom, transparent 0 calc(50% - var(--hauteur-bande) / 2), var(--couleur-1) calc(50% - var(--hauteur-bande) / 2) calc(50% + var(--hauteur-bande) / 2), transparent calc(50% + var(--hauteur-bande) / 2) 100%);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--couleur-1) 78%, transparent);
      }

      .etiquette__ruban {
        z-index: 2;
        top: calc(50% - var(--hauteur-ruban) / 2 + var(--decalage-ruban));
        left: calc((100% - var(--largeur-ruban)) / 2);
        right: auto;
        bottom: auto;
        width: var(--largeur-ruban);
        height: var(--hauteur-ruban);
        background: var(--couleur-1);
        clip-path: polygon(0 0, 100% 0, calc(100% - var(--cran-ruban)) 50%, 100% 100%, 0 100%, var(--cran-ruban) 50%);
      }

      .etiquette__ruban::before,
      .etiquette__ruban::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .etiquette__ruban::before {
        top: var(--epaisseur-ligne);
        bottom: var(--epaisseur-ligne);
        left: var(--cran-ruban);
        right: var(--cran-ruban);
        background: var(--couleur-ruban);
      }

      .etiquette__ruban::after {
        top: var(--epaisseur-ligne);
        bottom: var(--epaisseur-ligne);
        left: var(--cran-ruban);
        right: var(--cran-ruban);
        border-inline: var(--epaisseur-ligne) solid var(--couleur-1);
      }

      .etiquette__marque {
        position: absolute;
        z-index: 3;
        top: calc(50% - 0.5em + var(--decalage-ruban));
        color: var(--couleur-marques);
        font-size: clamp(0.78rem, 2.2vw, 1.2rem);
        font-weight: 800;
        line-height: 1;
        opacity: var(--opacite-marques);
      }

      .etiquette__marque--gauche {
        left: calc(var(--largeur-marques) / 2);
        transform: translateX(-50%);
      }

      .etiquette__marque--droite {
        right: calc(var(--largeur-marques) / 2);
        transform: translateX(50%);
      }

      .etiquette[data-modele="alice"],
      .etiquette[data-modele="martin"] {
        --hauteur-haut: 36%;
        --hauteur-bande: 33%;
        --hauteur-ruban: 33%;
        --largeur-ruban: 78.8%;
        --decalage-ruban: 0%;
        --cran-ruban: 7.8%;
        --epaisseur-ligne: 3px;
        --largeur-marques: 14.4%;
        background: var(--couleur-3);
      }

      .etiquette[data-modele="alice"] {
        --hauteur-bande: 15%;
        --hauteur-ruban: 25%;
        --largeur-ruban: 85%;
        --cran-ruban: 7.2%;
        --epaisseur-ligne: 0px;
        --largeur-marques: 14.2%;
        background: var(--couleur-3);
      }

      .etiquette[data-modele="alice"] .etiquette__artiste {
        top: 50.5%;
        left: 21%;
        right: 21%;
      }

      .etiquette[data-modele="alice"] .etiquette__decor {
        border-width: var(--trait);
        background: linear-gradient(to bottom, transparent 0 calc(50% - var(--hauteur-bande) / 2), var(--couleur-1) calc(50% - var(--hauteur-bande) / 2) calc(50% + var(--hauteur-bande) / 2), transparent calc(50% + var(--hauteur-bande) / 2) 100%);
        box-shadow: none;
      }

      .etiquette[data-modele="alice"] .etiquette__ruban {
        top: calc(50% - var(--hauteur-ruban) / 2);
        left: calc((100% - var(--largeur-ruban)) / 2);
        height: var(--hauteur-ruban);
        width: var(--largeur-ruban);
        background: var(--couleur-ruban);
        border-block: 3px solid var(--couleur-1);
        clip-path: none;
        overflow: visible;
      }

      .etiquette[data-modele="alice"] .etiquette__ruban::before {
        display: none;
      }

      .etiquette[data-modele="alice"] .etiquette__ruban::after {
        display: none;
      }

      .etiquette__fleche {
        display: none;
      }

      .etiquette[data-modele="alice"] .etiquette__fleche {
        z-index: 3;
        top: calc(50% - var(--hauteur-ruban) / 2);
        bottom: auto;
        left: auto;
        right: auto;
        width: 7.6%;
        height: var(--hauteur-ruban);
        display: block;
        background: var(--couleur-1);
      }

      .etiquette[data-modele="alice"] .etiquette__fleche--gauche {
        left: calc((100% - var(--largeur-ruban)) / 2);
        clip-path: polygon(0 0, 100% 50%, 0 100%);
      }

      .etiquette[data-modele="alice"] .etiquette__fleche--droite {
        right: calc((100% - var(--largeur-ruban)) / 2);
        clip-path: polygon(100% 0, 0 50%, 100% 100%);
      }

      .etiquette[data-modele="alice"] .etiquette__marque {
        top: calc(50% - 0.48em);
        font-size: clamp(0.74rem, 1.95vw, 1.05rem);
      }

      .etiquette[data-modele="alice"] .etiquette__marque--gauche {
        left: calc(var(--trait) + 1.2%);
        transform: none;
        text-align: left;
      }

      .etiquette[data-modele="alice"] .etiquette__marque--droite {
        right: calc(var(--trait) + 1.2%);
        transform: none;
        text-align: right;
      }

      .etiquette[data-modele="martin"] .etiquette__decor {
        border-width: var(--trait);
        background: linear-gradient(to bottom, transparent 0 calc(50% - var(--hauteur-bande) / 2), var(--couleur-1) calc(50% - var(--hauteur-bande) / 2) calc(50% + var(--hauteur-bande) / 2), transparent calc(50% + var(--hauteur-bande) / 2) 100%);
      }

      .etiquette[data-modele="martin"] .etiquette__ruban::before {
        left: calc(var(--cran-ruban) + 1.6%);
        right: calc(var(--cran-ruban) + 1.6%);
      }

      .etiquette__texte {
        position: absolute;
        z-index: 4;
        inset: 0;
        text-align: center;
        text-shadow: none;
        pointer-events: none;
      }

      .etiquette__titre,
      .etiquette__artiste {
        position: absolute;
        left: 8%;
        right: 8%;
        max-width: 100%;
        overflow: hidden;
        line-height: 1.02;
        text-overflow: ellipsis;
        transform: translateY(-50%);
      }

      .etiquette__titre:first-of-type {
        top: calc((50% - var(--hauteur-ruban) / 2 + var(--decalage-ruban)) / 2);
      }

      .etiquette__titre:last-of-type {
        top: calc((50% + var(--hauteur-ruban) / 2 + var(--decalage-ruban) + 100%) / 2);
      }

      .etiquette__titre {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        color: var(--couleur-texte);
        font-family: var(--police-titres);
        font-size: calc(1rem * var(--taille-titres, 1));
        font-weight: var(--poids-titres, 800);
      }

      .etiquette__artiste {
        top: calc(50% + var(--decalage-ruban));
        left: calc((100% - var(--largeur-ruban)) / 2 + var(--cran-ruban) + 1.6%);
        right: calc((100% - var(--largeur-ruban)) / 2 + var(--cran-ruban) + 1.6%);
        color: var(--couleur-artiste);
        font-family: var(--police-artiste);
        font-size: calc(1.55rem * var(--taille-artiste, 1));
        font-weight: var(--poids-artiste, 800);
        white-space: nowrap;
      }

      .planche-mini {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .planche-mini .etiquette {
        width: 100%;
      }

      .planche-mini .etiquette__titre {
        font-size: calc(0.42rem * var(--taille-titres, 1));
      }

      .planche-mini .etiquette__artiste {
        font-size: calc(0.64rem * var(--taille-artiste, 1));
      }

      .planche-mini .etiquette__marque {
        font-size: 0.52rem;
      }

      #planche-impression {
        display: none;
      }

      @media (max-width: 860px) {
        .page {
          padding: 14px;
        }

        .entete {
          align-items: start;
          flex-direction: column;
        }

        .atelier {
          grid-template-columns: 1fr;
        }

        .grille {
          grid-template-columns: 1fr;
        }

        .scene {
          min-height: 240px;
          padding: 14px;
        }
      }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }

        body {
          background: white !important;
        }

        body > :not(#planche-impression) {
          display: none !important;
        }

        #planche-impression {
          display: block;
          color: #18130f;
          background: white;
        }

        #planche-impression,
        #planche-impression * {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
          color-adjust: exact;
        }

        .page-impression {
          display: grid;
          width: 210mm;
          height: 297mm;
          padding: 0;
          grid-template-columns: repeat(var(--colonnes-impression, 2), var(--largeur-etiquette-mm));
          grid-template-rows: repeat(7, var(--hauteur-etiquette-mm));
          gap: 6mm;
          align-content: center;
          justify-content: center;
          break-after: page;
          page-break-after: always;
        }

        .page-impression:last-child {
          break-after: auto;
          page-break-after: auto;
        }

        .cellule-impression {
          width: var(--largeur-etiquette-mm);
          height: var(--hauteur-etiquette-mm);
          overflow: hidden;
          break-inside: avoid;
          page-break-inside: avoid;
        }

        #planche-impression .etiquette {
          width: var(--largeur-etiquette-px);
          height: var(--hauteur-etiquette-px);
          max-width: none;
          box-shadow: none;
          transform: scale(0.3779527559);
          transform-origin: top left;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="entete">
        <div>
          <p class="surtitre">Sélection 101</p>
          <h1>Étiquettes personnalisées</h1>
        </div>
        <a class="entete__retour" href="./index.html">Retour</a>
      </header>

      <section class="atelier" aria-label="Atelier étiquettes personnalisées">
        <form class="panneau controles" id="formulaire">
          <details class="groupe" open>
            <summary><p class="groupe__titre">Style de l'étiquette</p></summary>
            <div class="grille">
              <label class="champ">
                Famille
                <select id="theme" name="theme">
                  <option value="classique">Classique</option>
                </select>
              </label>
              <label class="champ">
                Étiquette
                <select id="modele" name="modele">
                  <option value="alice">Classique 1 - Alice</option>
                  <option value="martin">Classique 1 - Martin</option>
                </select>
              </label>
              <label class="champ champ-large">
                Deuxième étiquette optionnelle
                <select id="modeleSecondaire" name="modeleSecondaire">
                  <option value="">Aucune</option>
                </select>
              </label>
              <label class="champ champ-large" id="champEtiquetteActive" hidden>
                Modifier
                <select id="etiquetteActive" name="etiquetteActive">
                  <option value="1">Étiquette 1</option>
                  <option value="2" disabled>Étiquette 2</option>
                </select>
              </label>
            </div>
          </details>

          <details class="groupe">
            <summary><p class="groupe__titre">Palette</p></summary>
            <div class="grille">
              <label class="champ" data-reglage="couleur1">
                Cadre

      const elements = {

        couleur2: document.querySelector("#couleur2"),
        couleur3: document.querySelector("#couleur3"),
        couleurRuban: document.querySelector("#couleurRuban"),
        couleurVignette: document.querySelector("#couleurVignette"),
        angle: document.querySelector("#angle"),
        intensite: document.querySelector("#intensite"),
        motif: document.querySelector("#motif"),
        vignette: document.querySelector("#vignette"),
        bordure: document.querySelector("#bordure"),
        coins: document.querySelector("#coins"),
        largeurRuban: document.querySelector("#largeurRuban"),
        hauteurRuban: document.querySelector("#hauteurRuban"),
        hauteurBande: document.querySelector("#hauteurBande"),

        libelleAfficherMarques: document.querySelector("#libelleAfficherMarques"),
        controleMarqueGauche: document.querySelector("#controleMarqueGauche"),
        controleMarqueDroite: document.querySelector("#controleMarqueDroite"),
        marqueGauche: document.querySelector("#marqueGauche"),
        marqueDroite: document.querySelector("#marqueDroite"),
        policeTitres: document.querySelector("#policeTitres"),
        policeArtiste: document.querySelector("#policeArtiste"),
        couleurTitres: document.querySelector("#couleurTitres"),
        couleurArtiste: document.querySelector("#couleurArtiste"),
        tailleTitres: document.querySelector("#tailleTitres"),
        tailleArtiste: document.querySelector("#tailleArtiste"),
        grasTitres: document.querySelector("#grasTitres"),
        grasArtiste: document.querySelector("#grasArtiste"),
        largeurEtiquette: document.querySelector("#largeurEtiquette"),
        hauteurEtiquette: document.querySelector("#hauteurEtiquette"),
        impressionTous: document.querySelector("#impressionTous"),
        impressionSelections: document.querySelector("#impressionSelections"),
        selectionsImpression: document.querySelector("#selectionsImpression"),
        etatImpression: document.querySelector("#etatImpression"),
        imprimer: document.querySelector("#imprimer"),
        melanger: document.querySelector("#melanger"),
        inverserStyle: document.querySelector("#inverserStyle"),
        copier: document.querySelector("#copier"),
        apercuTitreA: document.querySelector("#apercuTitreA"),
        apercuArtiste: document.querySelector("#apercuArtiste"),
        apercuTitreB: document.querySelector("#apercuTitreB"),
      };

      const libellesValeurs = {
        angle: ["valeurAngle", "°"],
        intensite: ["valeurIntensite", "%"],
        motif: ["valeurMotif", "%"],
        vignette: ["valeurVignette", "%"],
        bordure: ["valeurBordure", " px"],
        coins: ["valeurCoins", " mm"],
        largeurRuban: ["valeurLargeurRuban", "%"],
        hauteurRuban: ["valeurHauteurRuban", "%"],
        hauteurBande: ["valeurHauteurBande", "%"],
        tailleTitres: ["valeurTailleTitres", "%"],
        tailleArtiste: ["valeurTailleArtiste", "%"],
      };

      const modelesParTheme = {
        classique: [
          ["alice", "Classique 1 - Alice"],
          ["martin", "Classique 1 - Martin"],
        ],
      };

      const presetsModeles = {
        alice: {
          theme: "classique",
          couleur1: "#7c007c",
          couleur2: "#fff8ff",
          couleur3: "#fff8ff",
          couleurRuban: "#d9b6ee",
          couleurTitres: "#17120e",
          couleurArtiste: "#17120e",
          angle: 0,
          intensite: 80,
          motif: 0,
          vignette: 0,
          bordure: 10,
          coins: 0,
          largeurRuban: 85,
          hauteurRuban: 25,
          hauteurBande: 15,
          afficherMarques: true,
          marqueGauche: "HIT",
          marqueDroite: "OLDY",
        },
        martin: {
          theme: "classique",
          couleur1: "#7c007c",
          couleur2: "#d9b6ee",
          couleur3: "#fff8ff",
          couleurRuban: "#fff8ff",
          couleurTitres: "#17120e",
          couleurArtiste: "#17120e",
          angle: 0,
          intensite: 80,
          motif: 0,
          vignette: 0,
          bordure: 5,
          coins: 0,
          largeurRuban: 79,
          hauteurRuban: 33,
          hauteurBande: 33,
          afficherMarques: true,
          marqueGauche: "HIT",
          marqueDroite: "OLDY",
        },
      };

      const palettes = [
        ["#7c007c", "#fff8ff", "#fff8ff", "#d9b6ee", "#17120e", "#7c007c"],
        ["#b9132a", "#fff8f0", "#fffdf8", "#f4c8d0", "#1b1210", "#7f0016"],
        ["#0a4f95", "#eaf4ff", "#fffdf8", "#c8ddf8", "#101923", "#0a3b70"],
        ["#137a3c", "#eff7e8", "#fffdf8", "#d3eccf", "#142016", "#0c5430"],
        ["#e0a900", "#fff7c8", "#fffdf8", "#ffe58a", "#231a08", "#9a5d00"],
        ["#4f236b", "#fff7ff", "#fffdf8", "#e1bee8", "#211026", "#3a164e"],
        ["#ef3a2d", "#fff7f2", "#fffdf8", "#ffd8cf", "#20110c", "#9a1e14"],
        ["#1f6f78", "#effcff", "#fffdf8", "#bcebf0", "#0f2022", "#14575e"],
      ];

      let vinylesBibliotheque = [];
      let bibliothequeChargee = false;
      const signaturesSurpriseRecentes = [];
      const reglagesParEtiquette = {
        1: null,
        2: null,
      };
      let etiquetteEnEdition = "1";
      let chargementReglages = false;

      function lireReglages() {
        const marqueGauche = elements.marqueGauche.value.trim();
        const marqueDroite = elements.marqueDroite.value.trim();

        return {
          theme: elements.theme.value,
          modele: elements.modele.value,
          couleur1: elements.couleur1.value,
          couleur2: elements.couleur2.value,
          couleur3: elements.couleur3.value,
          couleurRuban: elements.couleurRuban.value,
          couleurVignette: elements.couleurVignette.value,
          policeTitres: elements.policeTitres.value,
          policeArtiste: elements.policeArtiste.value,
          couleurTitres: elements.couleurTitres.value,
          couleurArtiste: elements.couleurArtiste.value,
          angle: Number(elements.angle.value),
          intensite: Number(elements.intensite.value),
          motif: Number(elements.motif.value),
          vignette: Number(elements.vignette.value),
          bordure: Number(elements.bordure.value),
          coins: Number(elements.coins.value),
          largeurRuban: Number(elements.largeurRuban.value),
          hauteurRuban: Number(elements.hauteurRuban.value),
          hauteurBande: Number(elements.hauteurBande.value),
          afficherMarques: elements.afficherMarques.checked,
          marqueGauche: marqueGauche || (elements.afficherMarques.checked ? "HIT" : ""),
          marqueDroite: marqueDroite || (elements.afficherMarques.checked ? "OLDY" : ""),
          tailleTitres: Number(elements.tailleTitres.value),
          tailleArtiste: Number(elements.tailleArtiste.value),
          grasTitres: elements.grasTitres.checked,
          grasArtiste: elements.grasArtiste.checked,
          largeurEtiquette: Math.max(30, Math.min(140, Number(elements.largeurEtiquette.value) || 77)),
          hauteurEtiquette: Math.max(10, Math.min(80, Number(elements.hauteurEtiquette.value) || 26)),
        };
      }

      function obtenirReglagesPourModele(modele) {
        const base = lireReglages();
        const preset = presetsModeles[modele];

        if (!modele || !preset) {
          return base;
        }

        return {
          ...base,
          ...preset,
          modele,
          policeTitres: base.policeTitres,
          policeArtiste: base.policeArtiste,
          tailleTitres: base.tailleTitres,
          tailleArtiste: base.tailleArtiste,
          grasTitres: base.grasTitres,
          grasArtiste: base.grasArtiste,
          largeurEtiquette: base.largeurEtiquette,
          hauteurEtiquette: base.hauteurEtiquette,
        };
      }

      function enregistrerReglagesEnEdition() {
        if (chargementReglages) {
          return;
        }

        const reglages = lireReglages();
        reglagesParEtiquette[etiquetteEnEdition] = reglages;
        if (etiquetteEnEdition === "2") {
          elements.modeleSecondaire.value = reglages.modele;
        }
      }

      function appliquerReglagesAuFormulaire(reglages) {
        chargementReglages = true;
        Object.entries(reglages).forEach(([cle, valeur]) => {
          if (!elements[cle]) {
            return;
          }
          if (elements[cle].type === "checkbox") {
            elements[cle].checked = Boolean(valeur);
          } else {
            elements[cle].value = String(valeur);
          }
        });
        chargementReglages = false;
      }

      function obtenirReglagesEtiquette(numero) {
        if (numero === "1") {
          return reglagesParEtiquette[1] || lireReglages();
        }

        if (!elements.modeleSecondaire.value) {
          return null;
        }

        if (!reglagesParEtiquette[2]) {
          reglagesParEtiquette[2] = creerReglagesSecondaireDefaut();
        }

        return reglagesParEtiquette[2];
      }

      function creerReglagesSecondaireDefaut() {
        const base = reglagesParEtiquette[1] || lireReglages();
        const modeleSecondaire = elements.modeleSecondaire.value || base.modele;
        const preset = presetsModeles[modeleSecondaire] || {};
        return creerReglagesInverses({
          ...base,
          ...preset,
          modele: modeleSecondaire,
          policeTitres: base.policeTitres,
          policeArtiste: base.policeArtiste,
          tailleTitres: base.tailleTitres,
          tailleArtiste: base.tailleArtiste,
          grasTitres: base.grasTitres,
          grasArtiste: base.grasArtiste,
          largeurEtiquette: base.largeurEtiquette,
          hauteurEtiquette: base.hauteurEtiquette,
          couleur2: base.couleur2,
          couleur3: base.couleur3,
          couleurRuban: base.couleurRuban,
        });
      }

      function changerEtiquetteEnEdition() {
        enregistrerReglagesEnEdition();
        etiquetteEnEdition = elements.etiquetteActive.value;

        if (etiquetteEnEdition === "2" && !elements.modeleSecondaire.value) {
          etiquetteEnEdition = "1";
          elements.etiquetteActive.value = "1";
        }

        appliquerReglagesAuFormulaire(obtenirReglagesEtiquette(etiquetteEnEdition) || obtenirReglagesEtiquette("1"));
        mettreAJour();
      }

      function modeleAvecEtiquette(reglages) {
        return Boolean(reglages.afficherMarques && (reglages.marqueGauche || reglages.marqueDroite));
      }

      function mettreAJourControleMarques(reglages) {
        const utile = Boolean(reglages.marqueGauche || reglages.marqueDroite);
        elements.controleAfficherMarques.hidden = !utile;
        elements.controleMarqueGauche.hidden = !utile;
        elements.controleMarqueDroite.hidden = !utile;

        if (!utile) {
          return;
        }

        const libelle = [reglages.marqueGauche, reglages.marqueDroite].filter(Boolean).join(" / ");
        elements.libelleAfficherMarques.textContent = `Étiquette ${libelle}`;
      }

      function mettreAJourReglagesUtiles(reglages) {
        const reglagesMasquesParModele = {
          alice: ["couleur2", "coins", "angle", "motif"],
        };
        const masques = new Set(reglagesMasquesParModele[reglages.modele] || []);

        document.querySelectorAll("[data-reglage]").forEach((controle) => {
          controle.hidden = masques.has(controle.dataset.reglage);
        });
      }

      function appliquerMarques(etiquette, reglages) {
        etiquette.querySelector(".etiquette__marque--gauche").textContent = reglages.marqueGauche;
        etiquette.querySelector(".etiquette__marque--droite").textContent = reglages.marqueDroite;
      }

      function appliquerReglages(etiquette, reglages) {
        etiquette.dataset.theme = reglages.theme;
        etiquette.dataset.modele = reglages.modele;
        etiquette.style.setProperty("--couleur-1", reglages.couleur1);
        etiquette.style.setProperty("--couleur-2", reglages.couleur2);
        etiquette.style.setProperty("--couleur-3", reglages.couleur3);
        etiquette.style.setProperty("--couleur-ruban", reglages.couleurRuban);
        etiquette.style.setProperty("--couleur-vignette", reglages.couleurVignette);
        etiquette.style.setProperty("--couleur-texte", reglages.couleurTitres);
        etiquette.style.setProperty("--couleur-artiste", reglages.couleurArtiste);
        etiquette.style.setProperty("--couleur-marques", choisirCouleurMarques(reglages.couleur1));
        etiquette.style.setProperty("--police-titres", obtenirPoliceCss(reglages.policeTitres));
        etiquette.style.setProperty("--police-artiste", obtenirPoliceCss(reglages.policeArtiste));
        etiquette.style.setProperty("--angle", `${reglages.angle}deg`);
        etiquette.style.setProperty("--intensite", String(reglages.intensite / 100));
        etiquette.style.setProperty("--motif-opacite", String(reglages.motif / 100));
        etiquette.style.setProperty("--vignette", String(reglages.vignette / 100));
        const forceVignette = (reglages.vignette / 100) * (reglages.intensite / 100);
        etiquette.style.setProperty("--vignette-rgba", convertirHexEnRgba(reglages.couleurVignette, forceVignette));
        etiquette.style.setProperty("--vignette-rgba-soft", convertirHexEnRgba(reglages.couleurVignette, forceVignette * 0.42));
        etiquette.style.setProperty("--vignette-lumiere", convertirHexEnRgba("#ffffff", forceVignette * 0.2));
        etiquette.style.setProperty("--trait", `${reglages.bordure}px`);
        etiquette.style.setProperty("--trait-mm", `${reglages.bordure / 10}mm`);
        etiquette.style.setProperty("--arrondi", `${reglages.coins}mm`);
        etiquette.style.setProperty("--largeur-ruban", `${reglages.largeurRuban}%`);
        etiquette.style.setProperty("--hauteur-ruban", `${reglages.hauteurRuban}%`);
        etiquette.style.setProperty("--hauteur-bande", `${reglages.hauteurBande}%`);
        etiquette.style.setProperty("--opacite-marques", modeleAvecEtiquette(reglages) ? "1" : "0");
        etiquette.style.setProperty("--taille-titres", String(reglages.tailleTitres / 100));
        etiquette.style.setProperty("--taille-artiste", String(reglages.tailleArtiste / 100));
        etiquette.style.setProperty("--poids-titres", reglages.grasTitres ? "800" : "500");
        etiquette.style.setProperty("--poids-artiste", reglages.grasArtiste ? "800" : "500");
        etiquette.style.setProperty("--largeur-etiquette", String(reglages.largeurEtiquette));
        etiquette.style.setProperty("--hauteur-etiquette", String(reglages.hauteurEtiquette));
        etiquette.style.setProperty("--largeur-etiquette-px", `${reglages.largeurEtiquette * 10}px`);
        etiquette.style.setProperty("--hauteur-etiquette-px", `${reglages.hauteurEtiquette * 10}px`);
      }

      function obtenirPoliceCss(police) {
        if (police === "compacte") {
          return '"Arial Narrow", "Helvetica Neue", Arial, sans-serif';
        }

        if (police === "classique") {
          return 'Georgia, "Times New Roman", serif';
        }

        return '"Courier Prime", "American Typewriter", "Courier New", monospace';
      }

      function choisirCouleurMarques(couleur) {
        const rouge = parseInt(couleur.slice(1, 3), 16);
        const vert = parseInt(couleur.slice(3, 5), 16);
        const bleu = parseInt(couleur.slice(5, 7), 16);
        const luminance = (rouge * 299 + vert * 587 + bleu * 114) / 1000;
        return luminance > 150 ? "#17120e" : "#fff8ff";
      }

      function convertirHexEnRgba(couleur, opacite) {
        const valeur = String(couleur || "#000000").replace("#", "");
        const rouge = parseInt(valeur.slice(0, 2), 16) || 0;
        const vert = parseInt(valeur.slice(2, 4), 16) || 0;
        const bleu = parseInt(valeur.slice(4, 6), 16) || 0;
        return `rgba(${rouge}, ${vert}, ${bleu}, ${Math.max(0, Math.min(1, opacite)).toFixed(3)})`;
      }

      function remplirEtiquette(etiquette, ligne) {
        etiquette.querySelector(".etiquette__titre:first-of-type").textContent = ligne.titreA;
        etiquette.querySelector(".etiquette__artiste").textContent = ligne.artiste;
        etiquette.querySelector(".etiquette__titre:last-of-type").textContent = ligne.titreB;
        etiquette.style.setProperty("--ajustement", calculerAjustement(Math.max(ligne.titreA.length, ligne.titreB.length), 32));
        etiquette.style.setProperty("--ajustement-artiste", calculerAjustement(ligne.artiste.length, 22));
      }

      function obtenirVinylesJukebox() {
        return vinylesBibliotheque
          .filter((vinyle) => vinyle.emplacement === "jukebox")
          .sort((a, b) => String(a.position_jukebox || "").localeCompare(String(b.position_jukebox || ""), "fr", { numeric: true }));
      }

      function convertirVinyleEnLigne(vinyle) {
        return {
          position: vinyle.position_jukebox || "",
          selectionA: vinyle.selection_face_a || "",
          selectionB: vinyle.selection_face_b || "",
          titreA: vinyle.titre_face_a || "Face A",
          artiste: raccourcirArtiste(vinyle.artiste || "Sans artiste"),
          titreB: vinyle.titre_face_b || "Face B",
        };
      }

      function obtenirLignesActives() {
        const vinylesJukebox = obtenirVinylesJukebox();
        if (!bibliothequeChargee || !vinylesJukebox.length) {
          return [];
        }

        if (elements.impressionSelections.checked) {
          const numeros = parserNumerosImpression(elements.selectionsImpression.value);
          if (numeros.size) {
            const vinylesFiltres = vinylesJukebox.filter((vinyle) => vinyleCorrespondNumeros(vinyle, numeros));
            return vinylesFiltres.map(convertirVinyleEnLigne);
          }
        }

        return vinylesJukebox.map(convertirVinyleEnLigne);
      }

      function parserNumerosImpression(texte) {
        const numeros = new Set();
        String(texte || "")
          .split(/[\s,;]+/)
          .map((fragment) => fragment.trim())
          .filter(Boolean)
          .forEach((fragment) => {
            const plage = fragment.match(/^(\d{1,3})-(\d{1,3})$/);
            if (plage) {
              const debut = Number(plage[1]);
              const fin = Number(plage[2]);
              const sens = debut <= fin ? 1 : -1;
              for (let valeur = debut; sens > 0 ? valeur <= fin : valeur >= fin; valeur += sens) {
                numeros.add(String(valeur).padStart(valeur < 100 ? 2 : 3, "0"));
              }
              return;
            }

            const nombre = Number(fragment);
            if (Number.isFinite(nombre)) {
              numeros.add(String(nombre).padStart(nombre < 100 ? 2 : 3, "0"));
            }
          });
        return numeros;
      }

      function vinyleCorrespondNumeros(vinyle, numeros) {
        return [
          vinyle.position_jukebox,
          vinyle.selection_face_a,
          vinyle.selection_face_b,
        ].some((numero) => numeros.has(String(numero || "")));
      }

      function raccourcirArtiste(artiste) {
        const texte = String(artiste || "").trim();
        return texte.length > 24 ? `${texte.slice(0, 23)}.` : texte;
      }

      function mettreAJourEtatImpression(nombre) {
        if (!elements.etatImpression) {
          return;
        }

        if (!bibliothequeChargee) {
          elements.etatImpression.textContent = "Bibliothèque indisponible.";
          return;
        }

        if (elements.impressionSelections.checked && !parserNumerosImpression(elements.selectionsImpression.value).size) {
          elements.etatImpression.textContent = "Entre des numéros pour filtrer, sinon tous les vinyles du jukebox restent utilisés.";
          return;
        }

        elements.etatImpression.textContent = `${nombre} étiquette(s) préparée(s) depuis la bibliothèque.`;
      }

      function calculerAjustement(longueur, seuil) {
        if (longueur <= seuil) {
          return "1";
        }

        return String(Math.max(0.62, seuil / longueur).toFixed(2));
      }

      function creerEtiquette(ligne, reglages) {
        const etiquette = document.createElement("article");
        etiquette.className = "etiquette";
        etiquette.innerHTML = `
          <div class="etiquette__decor"></div>
          <div class="etiquette__ruban"></div>
          <div class="etiquette__fleche etiquette__fleche--gauche"></div>
          <div class="etiquette__fleche etiquette__fleche--droite"></div>
          <div class="etiquette__marque etiquette__marque--gauche">HIT</div>
          <div class="etiquette__marque etiquette__marque--droite">OLDY</div>
          <div class="etiquette__texte">
            <div class="etiquette__titre"></div>
            <div class="etiquette__artiste"></div>
            <div class="etiquette__titre"></div>
          </div>
        `;
        appliquerReglages(etiquette, reglages);
        appliquerMarques(etiquette, reglages);
        remplirEtiquette(etiquette, ligne);
        return etiquette;
      }

      function creerVariantesCouleur(reglages) {
        const variantes = [
          [reglages.couleur1, reglages.couleur2, reglages.couleur3, reglages.couleurRuban],
          ["#b1142a", "#fff7f0", "#fffdf8", "#f8d8df"],
          ["#176c4f", "#d4ead0", "#fffdf8", "#fffdf8"],
          ["#1e5fa8", "#dcecff", "#fffdf8", "#fffdf8"],
        ];

        return variantes.map(([couleur1, couleur2, couleur3, couleurRuban]) => ({
          ...reglages,
          couleur1,
          couleur2,
          couleur3,
          couleurRuban,
        }));
      }

      function creerReglagesInverses(reglages) {
        return {
          ...reglages,
          couleur2: reglages.couleurRuban,
          couleur3: reglages.couleurRuban,
          couleurRuban: reglages.couleur3,
        };
      }

      function mettreAJour() {
        enregistrerReglagesEnEdition();
        const reglages = obtenirReglagesEtiquette("1");
        const reglagesSecondaires = obtenirReglagesEtiquette("2");
        const lignes = obtenirLignesActives();
        const premiereLigne = lignes[0];

        const deuxiemeEtiquetteActive = Boolean(elements.modeleSecondaire.value);
        elements.champEtiquetteActive.hidden = !deuxiemeEtiquetteActive;
        elements.etiquetteActive.options[1].disabled = !deuxiemeEtiquetteActive;
        if (!deuxiemeEtiquetteActive && etiquetteEnEdition === "2") {
          etiquetteEnEdition = "1";
          elements.etiquetteActive.value = "1";
        }

        if (!premiereLigne) {
          elements.miniPlanche.replaceChildren();
          elements.apercuSecondaire.hidden = true;
          mettreAJourEtatImpression(0);
          return;
        }

        mettreAJourControleMarques(obtenirReglagesEtiquette(etiquetteEnEdition) || reglages);
        mettreAJourReglagesUtiles(obtenirReglagesEtiquette(etiquetteEnEdition) || reglages);
        appliquerReglages(elements.apercu, reglages);
        appliquerMarques(elements.apercu, reglages);
        elements.apercuTitreA.textContent = premiereLigne.titreA;
        elements.apercuArtiste.textContent = premiereLigne.artiste;
        elements.apercuTitreB.textContent = premiereLigne.titreB;
        elements.apercu.style.setProperty("--ajustement", calculerAjustement(Math.max(premiereLigne.titreA.length, premiereLigne.titreB.length), 32));
        elements.apercu.style.setProperty("--ajustement-artiste", calculerAjustement(premiereLigne.artiste.length, 22));

        elements.apercuSecondaire.hidden = !reglagesSecondaires;
        if (reglagesSecondaires) {
          appliquerReglages(elements.apercuSecondaire, reglagesSecondaires);
          appliquerMarques(elements.apercuSecondaire, reglagesSecondaires);
          remplirEtiquette(elements.apercuSecondaire, premiereLigne);
        }

        Object.entries(libellesValeurs).forEach(([cle, [id, suffixe]]) => {
          const cible = document.querySelector(`#${id}`);
          cible.textContent = `${elements[cle].value}${suffixe}`;
        });

        elements.miniPlanche.replaceChildren();
        mettreAJourEtatImpression(lignes.length);
      }

      function construirePlanche() {
        enregistrerReglagesEnEdition();
        const reglages = obtenirReglagesEtiquette("1");
        const reglagesSecondaires = obtenirReglagesEtiquette("2");
        const lignes = obtenirLignesActives();
        const pages = [];
        const disposition = calculerDispositionImpression(reglages);

        elements.plancheImpression.style.setProperty("--largeur-etiquette-mm", `${reglages.largeurEtiquette}mm`);
        elements.plancheImpression.style.setProperty("--hauteur-etiquette-mm", `${reglages.hauteurEtiquette}mm`);
        elements.plancheImpression.style.setProperty("--colonnes-impression", String(disposition.colonnes));

        for (let index = 0; index < lignes.length; index += disposition.etiquettesParPage) {
          const page = document.createElement("section");
          page.className = "page-impression";
          page.replaceChildren(...lignes.slice(index, index + disposition.etiquettesParPage).map((ligne, decalage) => {
            const reglagesAlternes = reglagesSecondaires && (index + decalage) % 2 === 1 ? reglagesSecondaires : reglages;
            const cellule = document.createElement("div");
            cellule.className = "cellule-impression";
            cellule.append(creerEtiquette(ligne, reglagesAlternes));
            return cellule;
          }));
          pages.push(page);
        }

        elements.plancheImpression.replaceChildren(...pages);
      }

      function calculerDispositionImpression(reglages) {
        return {
          colonnes: 2,
          etiquettesParPage: 14,
        };
      }

      function melanger() {
        let surprise = null;
        let signature = "";

        for (let tentative = 0; tentative < 40; tentative += 1) {
          surprise = creerSurprise();
          signature = JSON.stringify(surprise);
          if (!signaturesSurpriseRecentes.includes(signature)) {
            break;
          }
        }

        elements.couleur1.value = surprise.couleur1;
        elements.couleur2.value = surprise.couleur2;
        elements.couleur3.value = surprise.couleur3;
        elements.couleurRuban.value = surprise.couleurRuban;
        elements.couleurTitres.value = surprise.couleurTexte;
        elements.couleurArtiste.value = surprise.couleurTexte;
        elements.couleurVignette.value = surprise.couleurVignette;
        elements.angle.value = String(surprise.angle);
        elements.intensite.value = String(surprise.intensite);
        elements.motif.value = String(surprise.motif);
        elements.vignette.value = String(surprise.vignette);
        signaturesSurpriseRecentes.push(signature);
        signaturesSurpriseRecentes.splice(0, Math.max(0, signaturesSurpriseRecentes.length - 12));
        mettreAJour();
      }

      function creerSurprise() {
        const palette = palettes[Math.floor(Math.random() * palettes.length)];
        const inverse = Math.random() > 0.58;
        const [couleur1, couleur2, couleur3, couleurRuban, couleurTexte, couleurVignette] = palette;

        return {
          couleur1,
          couleur2: inverse ? couleurRuban : couleur2,
          couleur3: inverse ? couleurRuban : couleur3,
          couleurRuban: inverse ? couleur3 : couleurRuban,
          couleurTexte,
          couleurVignette,
          angle: Math.floor(Math.random() * 13) * 10,
          intensite: 50 + Math.floor(Math.random() * 26) * 2,
          motif: Math.floor(Math.random() * 16) * 2,
          vignette: Math.floor(Math.random() * 18) * 2,
        };
      }

      function inverserStyle() {
        const couleurFond = elements.couleur3.value;
        const couleurRuban = elements.couleurRuban.value;
        elements.couleur2.value = couleurRuban;
        elements.couleur3.value = couleurRuban;
        elements.couleurRuban.value = couleurFond;
        mettreAJour();
      }

      function remplirModelesTheme() {
        const modeles = modelesParTheme[elements.theme.value] || modelesParTheme.classique;
        const valeurActuelle = elements.modele.value;
        const valeurSecondaire = elements.modeleSecondaire.value;
        elements.modele.replaceChildren(...modeles.map(([valeur, libelle]) => {
          const option = document.createElement("option");
          option.value = valeur;
          option.textContent = libelle;
          return option;
        }));
        elements.modeleSecondaire.replaceChildren(
          new Option("Aucune", ""),
          ...modeles.map(([valeur, libelle]) => new Option(libelle, valeur))
        );

        if (modeles.some(([valeur]) => valeur === valeurActuelle)) {
          elements.modele.value = valeurActuelle;
        } else {
          elements.modele.value = modeles[0][0];
        }

        elements.modeleSecondaire.value = modeles.some(([valeur]) => valeur === valeurSecondaire) ? valeurSecondaire : "";
      }

      function changerTheme() {
        remplirModelesTheme();
        appliquerPresetModele();
      }

      function changerModeleSecondaire() {
        if (!elements.modeleSecondaire.value) {
          reglagesParEtiquette[2] = null;
          etiquetteEnEdition = "1";
          elements.etiquetteActive.value = "1";
          elements.etiquetteActive.options[1].disabled = true;
          appliquerReglagesAuFormulaire(obtenirReglagesEtiquette("1"));
          mettreAJour();
          return;
        }

        reglagesParEtiquette[2] = creerReglagesSecondaireDefaut();
        elements.etiquetteActive.options[1].disabled = false;
        if (etiquetteEnEdition === "2") {
          appliquerReglagesAuFormulaire(reglagesParEtiquette[2]);
        }
        mettreAJour();
      }

      async function chargerBibliotheque() {
        try {
          const reponse = await fetch("./bibliotheque.json", { cache: "no-store" });
          if (!reponse.ok) {
            throw new Error("Bibliothèque indisponible");
          }

          const donnees = await reponse.json();
          vinylesBibliotheque = Array.isArray(donnees.vinyles) ? donnees.vinyles : [];
          bibliothequeChargee = true;
        } catch {
          vinylesBibliotheque = [];
          bibliothequeChargee = false;
        }

        mettreAJour();
      }

      function appliquerPresetModele() {
        const preset = presetsModeles[elements.modele.value];
        if (!preset) {
          mettreAJour();
          return;
        }

        if (etiquetteEnEdition === "2") {
          elements.modeleSecondaire.value = elements.modele.value;
        }

        Object.entries(preset).forEach(([cle, valeur]) => {
          if (cle === "theme") {
            return;
          }
          if (elements[cle]) {
            if (elements[cle].type === "checkbox") {
              elements[cle].checked = Boolean(valeur);
            } else {
              elements[cle].value = String(valeur);
            }
          }
        });
        if (!Object.prototype.hasOwnProperty.call(preset, "couleurVignette")) {
          elements.couleurVignette.value = "#000000";
        }
        mettreAJour();
      }

      async function copierReglages() {
        const texte = JSON.stringify(lireReglages(), null, 2);
        try {
          await navigator.clipboard.writeText(texte);
          elements.copier.textContent = "Réglages copiés";
          setTimeout(() => {
            elements.copier.textContent = "Copier réglages";
          }, 1400);
        } catch {
          window.prompt("Réglages", texte);
        }
      }

      elements.formulaire.addEventListener("input", mettreAJour);
      elements.theme.addEventListener("change", changerTheme);
      elements.modele.addEventListener("change", appliquerPresetModele);
      elements.modeleSecondaire.addEventListener("change", changerModeleSecondaire);
      elements.etiquetteActive.addEventListener("change", changerEtiquetteEnEdition);
      elements.melanger.addEventListener("click", melanger);
      elements.inverserStyle.addEventListener("click", inverserStyle);
      elements.copier.addEventListener("click", copierReglages);
      elements.imprimer.addEventListener("click", () => {
        construirePlanche();
        if (elements.plancheImpression.children.length) {
          window.print();
        }
      });

      remplirModelesTheme();
      appliquerPresetModele();
      chargerBibliotheque();
    </script>
  </body>
